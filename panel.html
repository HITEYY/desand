<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Panel</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
    --accent: #2f6fdf; --ok: #2e8b57; --busy: #c98a12; --err: #c0392b; --code: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --line: #33332f;
            --accent: #6d9cf0; --ok: #5cc28a; --busy: #e0ad4a; --err: #e5675a; --code: #2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text);
         display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 1fr auto; height: 100vh; }
  aside { grid-row: 1 / 3; border-right: 1px solid var(--line); padding: 16px; overflow: auto; background: var(--panel); }
  h1 { font-size: 15px; margin: 0 0 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 8px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .avail { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  main { overflow: auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex;
          flex-direction: column; height: calc(100vh - 140px); min-height: 300px; }
  .card header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .card header .meta { flex: 1; min-width: 0; }
  .card header .meta b { display: block; }
  .card header .meta small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.busy { background: var(--busy); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
  .log { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; padding: 6px 10px; border-radius: 10px; max-width: 85%; }
  .msg.tool, .msg.call { font: 12px/1.4 ui-monospace, monospace; background: var(--code); padding: 6px 8px; border-radius: 6px; color: var(--muted); }
  .msg.err { color: var(--err); }
  .empty { color: var(--muted); margin: auto; }
  footer { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); display: flex; gap: 8px; }
  footer textarea { flex: 1; font: inherit; resize: none; height: 44px; padding: 8px 10px; border-radius: 8px;
                    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #toast { position: fixed; right: 16px; bottom: 76px; background: var(--err); color: #fff; padding: 8px 12px;
           border-radius: 8px; display: none; max-width: 420px; }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    aside { grid-row: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<aside>
  <h1>Agent Panel</h1>
  <h2>Agents</h2>
  <div id="available"></div>
</aside>
<main id="running"><p class="empty">왼쪽에서 에이전트를 시작하세요.</p></main>
<footer>
  <textarea id="input" placeholder="체크된 에이전트에게 보낼 메시지 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
  <button class="primary" id="send">Send</button>
</footer>
<div id="toast"></div>
<script>
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const selected = new Set();   // agents checked to receive messages
const rendered = {};          // name -> signature of last render, to keep scroll position stable

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json();
  if (!r.ok) toast(data.error || r.statusText);
  return data;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); }

function renderLog(log, a) {
  log.replaceChildren();
  for (const m of a.messages) {
    if (m.role === "system") continue;
    if (m.role === "user") log.append(el("div", "msg user", m.content));
    else if (m.role === "tool") log.append(el("div", "msg tool", "→ " + String(m.content).slice(0, 400)));
    else {
      if (m.content) log.append(el("div", "msg", m.content));
      for (const c of m.tool_calls || []) log.append(el("div", "msg call", `⚙ ${c.function.name}(${c.function.arguments})`));
    }
  }
  if (a.error) log.append(el("div", "msg err", "error: " + a.error));
  if (a.busy) log.append(el("div", "msg call", "…"));
  log.scrollTop = log.scrollHeight;
}

function render(state) {
  const runningNames = state.running.map(a => a.name);
  const av = $("#available"); av.replaceChildren();
  for (const n of state.available) {
    const row = el("div", "avail"); row.append(el("span", null, n));
    const b = el("button", null, runningNames.includes(n) ? "Running" : "Start");
    b.disabled = runningNames.includes(n);
    b.onclick = async () => { await api("/api/start", { name: n }); selected.add(n); refresh(); };
    row.append(b); av.append(row);
  }

  const main = $("#running");
  for (const n of [...selected]) if (!runningNames.includes(n)) selected.delete(n);
  for (const card of [...main.querySelectorAll(".card")]) if (!runningNames.includes(card.dataset.name)) { card.remove(); delete rendered[card.dataset.name]; }
  main.querySelector(".empty")?.remove();
  if (!state.running.length) main.append(el("p", "empty", "왼쪽에서 에이전트를 시작하세요."));

  for (const a of state.running) {
    let card = main.querySelector(`.card[data-name="${CSS.escape(a.name)}"]`);
    if (!card) {
      card = el("section", "card"); card.dataset.name = a.name;
      const head = el("header");
      const cb = el("input"); cb.type = "checkbox"; cb.checked = selected.has(a.name); cb.title = "메시지 받기";
      cb.onchange = () => cb.checked ? selected.add(a.name) : selected.delete(a.name);
      const meta = el("div", "meta"); meta.append(el("b", null, a.name), el("small", null, `${a.provider} / ${a.model}`));
      const reset = el("button", null, "Reset"); reset.onclick = () => api("/api/reset", { name: a.name }).then(refresh);
      const stop = el("button", null, "Stop"); stop.onclick = () => api("/api/stop", { name: a.name }).then(refresh);
      head.append(cb, el("span", "dot"), meta, reset, stop);
      card.append(head, el("div", "log"));
      main.append(card);
    }
    card.querySelector(".dot").classList.toggle("busy", a.busy);
    const sig = JSON.stringify([a.messages.length, a.busy, a.error]);
    if (rendered[a.name] !== sig) { rendered[a.name] = sig; renderLog(card.querySelector(".log"), a); }
  }
}

async function refresh() { try { render(await api("/api/state")); } catch (e) { /* server restarting */ } }

async function send() {
  const text = $("#input").value.trim();
  if (!text) return;
  if (!selected.size) return toast("메시지를 받을 에이전트를 체크하세요.");
  const r = await api("/api/send", { names: [...selected], text });
  if (r.ok) $("#input").value = "";
  refresh();
}
$("#send").onclick = send;
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });

refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
